<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helping rates by treatment</title>
  <style>
    :root {
      --bar: #d90000;
      --bar-border: #8f0000;
      --grid: #a7a7a7;
      --text: #111;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--text);
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    .chart {
      display: grid;
      grid-template-columns: 58px 66px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) auto;
      width: min(960px, 97vw);
      height: min(460px, 97vh);
      padding-top: 58px;
    }

    .y-title {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 27px;
      font-weight: 600;
    }

    .y-labels {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      padding-right: 12px;
      font-size: 23px;
      line-height: 1;
    }

    .panel {
      position: relative;
      grid-column: 3;
      grid-row: 1;
      min-height: 0;
      border-left: 2px solid #999;
      border-bottom: 2px solid #999;
    }

    .gridlines {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .gridlines span {
      display: block;
      width: 100%;
      border-top: 2px dashed var(--grid);
    }

    .gridlines span:last-child {
      border-top: 0;
    }

    .bars {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 0 3%;
    }

    .bar-slot {
      position: relative;
      height: 100%;
    }

    .bar {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 52%;
      max-width: 150px;
      height: var(--value);
      border: 0;
      outline: none;
      background: var(--bar);
      transform: translateX(-50%);
      transition: filter 120ms ease;
    }

    .bar:hover,
    .bar:focus,
    .bar:focus-visible {
      outline: 3px solid var(--bar-border);
      outline-offset: 0;
      filter: brightness(0.97);
    }

    .bar::after {
      position: absolute;
      bottom: calc(100% + 30px);
      left: 50%;
      z-index: 4;
      width: 255px;
      padding: 10px 12px;
      border-radius: 6px;
      color: white;
      background: #252525;
      box-shadow: 0 4px 12px rgb(0 0 0 / 25%);
      content: attr(data-tooltip);
      font-size: 17px;
      line-height: 1.3;
      text-align: left;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 4px);
      transition: opacity 120ms ease, transform 120ms ease, visibility 120ms;
    }

    .bar:hover::after,
    .bar:focus-visible::after {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    .error-bar {
      position: absolute;
      bottom: var(--lower);
      left: 50%;
      z-index: 3;
      height: calc(var(--upper) - var(--lower));
      border-left: 2px solid #111;
      pointer-events: none;
      transform: translateX(-50%);
    }

    .error-bar::before,
    .error-bar::after {
      position: absolute;
      left: 50%;
      width: 16px;
      border-top: 2px solid #111;
      content: "";
      transform: translateX(-50%);
    }

    .error-bar::before {
      top: 0;
    }

    .error-bar::after {
      bottom: 0;
    }

    .x-labels {
      grid-column: 3;
      grid-row: 2;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 13px 3% 0;
      font-size: 25px;
      text-align: center;
    }

  </style>
</head>
<body>
  <main class="chart" role="group"
        aria-label="Helping rates by treatment: 39.7 percent in BaseHelp, 18.6 percent in HelpViolator, and 44.4 percent in HelpPunisher.">
    <div class="y-title">Helping rate</div>

    <div class="y-labels" aria-hidden="true">
      <span>60%</span>
      <span>50%</span>
      <span>40%</span>
      <span>30%</span>
      <span>20%</span>
      <span>10%</span>
      <span aria-hidden="true"></span>
    </div>

    <div class="panel">
      <div class="gridlines" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>

      <div class="bars">
        <div class="bar-slot">
          <div class="bar" style="--value: 66.17%;" tabindex="0" role="img"
               aria-label="BaseHelp: 40 percent of observers helped the actor."
               data-tooltip="BaseHelp: 40% of observers helped the actor."></div>
          <div class="error-bar" style="--lower: 59%; --upper: 73.33%;" aria-hidden="true"></div>
        </div>

        <div class="bar-slot">
          <div class="bar" style="--value: 31%;" tabindex="0" role="img"
               aria-label="HelpViolator: 19 percent of observers helped the norm violator. This was 21 percentage points less than in BaseHelp."
               data-tooltip="HelpViolator: 19% helped the norm violator. This was 21 percentage points less than in BaseHelp."></div>
          <div class="error-bar" style="--lower: 24.67%; --upper: 37.5%;" aria-hidden="true"></div>
        </div>

        <div class="bar-slot">
          <div class="bar" style="--value: 74%;" tabindex="0" role="img"
               aria-label="HelpPunisher: 44 percent of observers helped the punisher. This was not significantly different from BaseHelp."
               data-tooltip="HelpPunisher: 44% helped the punisher. This was not significantly different from BaseHelp."></div>
          <div class="error-bar" style="--lower: 66%; --upper: 82%;" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <div class="x-labels" aria-hidden="true">
      <span>BaseHelp</span>
      <span>HelpViolator</span>
      <span>HelpPunisher</span>
    </div>

  </main>
</body>
</html>
