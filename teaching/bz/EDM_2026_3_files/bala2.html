<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Direct punishment rates by treatment</title>
  <style>
    :root {
      --bar: #d90000;
      --bar-border: #8f0000;
      --grid: #a7a7a7;
      --text: #111;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--text);
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    .chart {
      display: grid;
      grid-template-columns: 58px 66px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) auto;
      width: min(960px, 97vw);
      height: min(460px, 97vh);
      padding-top: 58px;
    }

    .y-title {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 27px;
      font-weight: 600;
    }

    .y-labels {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      padding-right: 12px;
      font-size: 23px;
      line-height: 1;
    }

    .panel {
      position: relative;
      grid-column: 3;
      grid-row: 1;
      min-height: 0;
      border-left: 2px solid #999;
      border-bottom: 2px solid #999;
    }

    .gridlines {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .gridlines span {
      display: block;
      width: 100%;
      border-top: 2px dashed var(--grid);
    }

    .gridlines span:last-child {
      border-top: 0;
    }

    .bars {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      padding: 0 7%;
    }

    .bar-slot {
      position: relative;
      height: 100%;
    }

    .bar {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 48%;
      max-width: 180px;
      height: var(--value);
      border: 0;
      outline: none;
      background: var(--bar);
      transform: translateX(-50%);
      transition: filter 120ms ease;
    }

    .bar:hover,
    .bar:focus,
    .bar:focus-visible {
      outline: 3px solid var(--bar-border);
      outline-offset: 0;
      filter: brightness(0.97);
    }

    .bar::after {
      position: absolute;
      bottom: calc(100% + 30px);
      left: 50%;
      z-index: 4;
      width: 275px;
      padding: 10px 12px;
      border-radius: 6px;
      color: white;
      background: #252525;
      box-shadow: 0 4px 12px rgb(0 0 0 / 25%);
      content: attr(data-tooltip);
      font-size: 17px;
      line-height: 1.3;
      text-align: left;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 4px);
      transition: opacity 120ms ease, transform 120ms ease, visibility 120ms;
    }

    .bar:hover::after,
    .bar:focus-visible::after,
    .bar:focus::after {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    .error-bar {
      position: absolute;
      bottom: var(--lower);
      left: 50%;
      z-index: 3;
      height: calc(var(--upper) - var(--lower));
      border-left: 2px solid #111;
      pointer-events: none;
      transform: translateX(-50%);
    }

    .error-bar::before,
    .error-bar::after {
      position: absolute;
      left: 50%;
      width: 16px;
      border-top: 2px solid #111;
      content: "";
      transform: translateX(-50%);
    }

    .error-bar::before {
      top: 0;
    }

    .error-bar::after {
      bottom: 0;
    }

    .x-labels {
      grid-column: 3;
      grid-row: 2;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      padding: 13px 7% 0;
      font-size: 25px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="chart" role="group"
        aria-label="Direct punishment rates by treatment: 17 percent in BasePun and 6.8 percent in HelpViolator.">
    <div class="y-title">Direct punishment rate</div>

    <div class="y-labels" aria-hidden="true">
      <span>30%</span>
      <span>25%</span>
      <span>20%</span>
      <span>15%</span>
      <span>10%</span>
      <span>5%</span>
      <span aria-hidden="true"></span>
    </div>

    <div class="panel">
      <div class="gridlines" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>

      <div class="bars">
        <div class="bar-slot">
          <div class="bar" style="--value: 56.67%;" tabindex="0" role="img"
               aria-label="BasePun: observers directly punished the norm violator in 17 percent of cases."
               data-tooltip="BasePun: observers directly punished the norm violator in 17% of cases."></div>
          <div class="error-bar" style="--lower: 44.51%; --upper: 68.83%;" aria-hidden="true"></div>
        </div>

        <div class="bar-slot">
          <div class="bar" style="--value: 22.67%;" tabindex="0" role="img"
               aria-label="HelpViolator: observers directly punished the norm violator in 7 percent of cases when indirect punishment was also possible. This rate was significantly lower than in BasePun."
               data-tooltip="HelpViolator: observers directly punished the norm violator in 7% of cases when indirect punishment was also possible. This was significantly lower than in BasePun."></div>
          <div class="error-bar" style="--lower: 14.36%; --upper: 30.98%;" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <div class="x-labels" aria-hidden="true">
      <span>BasePun</span>
      <span>HelpViolator</span>
    </div>
  </main>
</body>
</html>
