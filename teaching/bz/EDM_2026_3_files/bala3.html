<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Direct and indirect punishment by violator's sex</title>
  <style>
    :root {
      --male: #173b67;
      --male-border: #092445;
      --female: #e38f90;
      --female-border: #ad5558;
      --grid: #a7a7a7;
      --text: #111;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--text);
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    .chart {
      display: grid;
      grid-template-columns: 58px 66px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) auto auto;
      width: min(980px, 98vw);
      height: min(470px, 97vh);
      padding-top: 72px;
    }

    .y-title {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 27px;
      font-weight: 600;
    }

    .y-labels {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      padding-right: 12px;
      font-size: 23px;
      line-height: 1;
    }

    .panel {
      position: relative;
      grid-column: 3;
      grid-row: 1;
      min-height: 0;
      border-left: 2px solid #999;
      border-bottom: 2px solid #999;
    }

    .gridlines {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .gridlines span {
      display: block;
      width: 100%;
      border-top: 2px dashed var(--grid);
    }

    .gridlines span:last-child {
      border-top: 0;
    }

    .groups {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7%;
      padding: 0 5%;
    }

    .bar-group {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 8px;
      height: 100%;
    }

    .bar {
      position: relative;
      width: 42%;
      max-width: 130px;
      height: var(--value);
      border: 0;
      outline: none;
      transition: filter 120ms ease;
    }

    .bar.male {
      --hover-border: var(--male-border);
      background: var(--male);
    }

    .bar.female {
      --hover-border: var(--female-border);
      background: var(--female);
    }

    .bar:hover,
    .bar:focus,
    .bar:focus-visible {
      z-index: 5;
      outline: 3px solid var(--hover-border);
      outline-offset: 0;
      filter: brightness(0.97);
    }

    .bar::after {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      z-index: 4;
      width: max-content;
      max-width: 230px;
      padding: 10px 12px;
      border-radius: 6px;
      color: white;
      background: #252525;
      box-shadow: 0 4px 12px rgb(0 0 0 / 25%);
      content: attr(data-tooltip);
      font-size: 17px;
      line-height: 1.3;
      text-align: left;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 4px);
      transition: opacity 120ms ease, transform 120ms ease, visibility 120ms;
    }

    .bar:hover::after,
    .bar:focus::after,
    .bar:focus-visible::after {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    .x-labels {
      grid-column: 3;
      grid-row: 2;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7%;
      padding: 13px 5% 0;
      font-size: 20px;
      text-align: center;
    }

    .legend {
      grid-column: 3;
      grid-row: 3;
      display: flex;
      justify-content: center;
      gap: 34px;
      margin-top: 16px;
      font-size: 19px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .swatch {
      width: 13px;
      height: 13px;
    }

    .swatch.male {
      background: var(--male);
    }

    .swatch.female {
      background: var(--female);
    }
  </style>
</head>
<body>
  <main class="chart" role="group"
        aria-label="Direct and indirect punishment rates by the sex of the violator.">
    <div class="y-title">Punishment rate</div>

    <div class="y-labels" aria-hidden="true">
      <span>30%</span>
      <span>25%</span>
      <span>20%</span>
      <span>15%</span>
      <span>10%</span>
      <span>5%</span>
      <span aria-hidden="true"></span>
    </div>

    <div class="panel">
      <div class="gridlines" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>

      <div class="groups">
        <div class="bar-group">
          <div class="bar male" style="--value: 20.33%;" tabindex="0" role="img"
               aria-label="Male violators were directly punished in 6 percent of cases."
               data-tooltip="Male violators were directly punished in 6% of cases."></div>
          <div class="bar female" style="--value: 87.67%;" tabindex="0" role="img"
               aria-label="Female violators were directly punished in 26 percent of cases, more than four times the rate for male violators."
               data-tooltip="Female violators were directly punished in 26% of cases, more than four times the rate for male violators."></div>
        </div>

        <div class="bar-group">
          <div class="bar male" style="--value: 91%;" tabindex="0" role="img"
               aria-label="The indirect punishment rate for male violators was 27 percent."
               data-tooltip="The indirect punishment rate for male violators was 27%."></div>
          <div class="bar female" style="--value: 44.67%;" tabindex="0" role="img"
               aria-label="The indirect punishment rate for female violators was 13 percent, about half the rate for male violators."
               data-tooltip="The indirect punishment rate for female violators was 13%, about half the rate for male violators."></div>
        </div>
      </div>
    </div>

    <div class="x-labels" aria-hidden="true">
      <span>Direct punishment (BasePun)</span>
      <span>Indirect punishment (BaseHelp − HelpViolator)</span>
    </div>

    <div class="legend" aria-hidden="true">
      <span class="legend-item"><span class="swatch male"></span>Male violator</span>
      <span class="legend-item"><span class="swatch female"></span>Female violator</span>
    </div>
  </main>
</body>
</html>
