<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Average trap-hole size by contribution level</title>
  <style>
    :root {
      --bar: #b8b574;
      --bar-border: #85823f;
      --grid: #e5eaec;
      --text: #111;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--text);
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    .chart {
      display: grid;
      grid-template-columns: 58px 58px minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) auto auto;
      width: min(940px, 96vw);
      height: min(500px, 96vh);
      padding-top: 50px;
    }

    .y-title {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 27px;
    }

    .y-labels {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      padding-right: 12px;
      font-size: 24px;
      line-height: 1;
    }

    .panel {
      position: relative;
      grid-column: 3;
      grid-row: 1;
      min-height: 0;
      border-left: 2px solid var(--text);
      border-bottom: 2px solid var(--text);
    }

    .gridlines {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .gridlines span {
      display: block;
      width: 100%;
      border-top: 3px solid var(--grid);
    }

    .bars {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: end;
      padding: 0 4%;
    }

    .bar {
      position: relative;
      width: 64%;
      max-width: 170px;
      margin: 0 auto;
      background: var(--bar);
      transition: transform 120ms ease;
    }

    .bar:hover,
    .bar:focus-visible {
      outline: 3px solid var(--bar-border);
      outline-offset: 0;
      transform: translateY(-2px);
    }

    .bar::after {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      z-index: 3;
      width: 250px;
      padding: 10px 12px;
      border-radius: 6px;
      color: white;
      background: #252525;
      box-shadow: 0 4px 12px rgb(0 0 0 / 25%);
      content: attr(data-tooltip);
      font-size: 17px;
      line-height: 1.3;
      text-align: left;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 4px);
      transition: opacity 120ms ease, transform 120ms ease, visibility 120ms;
    }

    .bar:hover::after,
    .bar:focus-visible::after {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    .x-labels {
      grid-column: 3;
      grid-row: 2;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 12px 4% 0;
      font-size: 25px;
      text-align: center;
    }

    .x-title {
      grid-column: 3;
      grid-row: 3;
      margin-top: 20px;
      font-size: 27px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="chart" role="group"
        aria-label="Average trap-hole size rises from 0.413 centimetres for low contributors to 0.442 for medium contributors and 0.483 for high contributors.">
    <div class="y-title">Average hole size (cm)</div>

    <div class="y-labels" aria-hidden="true">
      <span>.5</span>
      <span>.48</span>
      <span>.46</span>
      <span>.44</span>
      <span>.42</span>
      <span>.4</span>
    </div>

    <div class="panel">
      <div class="gridlines" aria-hidden="true">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>

      <div class="bars">
        <div class="bar" style="height: 13%;" tabindex="0" role="img"
             aria-label="The shrimpers who contributed the least in the experiment had the smallest trap holes on average. Their average hole size was about 0.41 centimetres."
             data-tooltip="The shrimpers who contributed the least in the experiment had the smallest trap holes on average (average hole size ~ 0.41 cm)."></div>
        <div class="bar" style="height: 42%;" tabindex="0" role="img"
             aria-label="The shrimpers in the middle contribution group had intermediate-sized trap holes on average. Their average hole size was about 0.44 centimetres."
             data-tooltip="The shrimpers in the middle contribution group had intermediate-sized trap holes on average (average hole size ~ 0.44 cm)."></div>
        <div class="bar" style="height: 83%;" tabindex="0" role="img"
             aria-label="The shrimpers who contributed the most in the experiment had the largest trap holes on average. Their average hole size was about 0.48 centimetres."
             data-tooltip="The shrimpers who contributed the most in the experiment had the largest trap holes on average (average hole size ~ 0.48 cm)."></div>
      </div>
    </div>

    <div class="x-labels" aria-hidden="true">
      <span>Low</span>
      <span>Medium</span>
      <span>High</span>
    </div>

    <div class="x-title">Level of contribution in the public goods experiment</div>
  </main>
</body>
</html>
