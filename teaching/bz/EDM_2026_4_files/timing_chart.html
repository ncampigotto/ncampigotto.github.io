<script>
(() => {
  const init = () => {
    const figure = document.querySelector('[data-transfer-timing]');
    if (!figure || figure.dataset.ready) return;
    figure.dataset.ready = 'true';
    const buttons = figure.querySelectorAll('.type-button');
    const cards = figure.querySelectorAll('.example-card');
    const selectType = (selectedType, event) => {
      event.preventDefault();
      event.stopPropagation();
      for (const control of [...buttons, ...cards]) {
        const active = control.dataset.type === selectedType;
        control.setAttribute('aria-pressed', String(active));
        control.classList.toggle('active', active);
      }
    };
    for (const control of [...buttons, ...cards]) {
      control.addEventListener('click', event => selectType(control.dataset.type, event));
      control.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') selectType(control.dataset.type, event);
      });
    }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
