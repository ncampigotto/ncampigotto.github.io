<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Quarterly-report treatment effects over time</title>
  <desc id="chart-desc">Red bars show the estimated effect of quarterly home energy reports on electricity use in each month from January 2008 through November 2010. Effects are near zero before reports began in 2009, then mostly negative, reaching roughly minus 2 to minus 3 percent in 2010. January 2009 is the omitted reference month.</desc>
  <g font-family="Roboto, Arial, sans-serif" fill="#131516">
    <!-- Red coefficients visually digitized from Allcott (2011), Figure 4.
         Values are approximate percentages. January 2009 is the excluded month. -->
    <rect x="110" y="70" width="367" height="420" fill="#f6f8f9"/>
    <rect x="477" y="70" width="353" height="420" fill="#fff"/>
    <rect x="830" y="70" width="340" height="420" fill="#f6f8f9"/>
    <g stroke="#d8dde0" stroke-width="1.5">
      <path d="M110 70H1170 M110 256.7H1170 M110 350H1170 M110 443.3H1170"/>
    </g>
    <path d="M830 70V490" stroke="#9caab0" stroke-width="2.5"/>
    <path d="M477 70V490" stroke="#9caab0" stroke-width="2.5"/>

    <g fill="#BF0000">
      <!-- 2008 -->
      <rect x="130" y="112.9" width="18" height="50.4"/>
      <rect x="159.4" y="112.9" width="18" height="50.4"/>
      <rect x="188.8" y="119.5" width="18" height="43.9"/>
      <rect x="218.2" y="96.1" width="18" height="67.2"/>
      <rect x="247.6" y="123.2" width="18" height="40.1"/>
      <rect x="306.4" y="163.3" width="18" height="28"/>
      <rect x="335.8" y="163.3" width="18" height="84"/>
      <rect x="365.2" y="163.3" width="18" height="35.5"/>
      <rect x="394.6" y="163.3" width="18" height="2.8"/>
      <rect x="424" y="121.3" width="18" height="42"/>
      <rect x="453.4" y="129.7" width="18" height="33.6"/>
      <!-- 2009: January is the excluded reference month. -->
      <rect x="512.2" y="163.3" width="18" height="6.5"/>
      <rect x="541.6" y="163.3" width="18" height="103.6"/>
      <rect x="571" y="163.3" width="18" height="84"/>
      <rect x="600.4" y="163.3" width="18" height="53.2"/>
      <rect x="629.8" y="163.3" width="18" height="121.3"/>
      <rect x="659.2" y="163.3" width="18" height="215.6"/>
      <rect x="688.6" y="163.3" width="18" height="204.4"/>
      <rect x="718" y="163.3" width="18" height="193.2"/>
      <rect x="747.4" y="163.3" width="18" height="167.1"/>
      <rect x="776.8" y="163.3" width="18" height="139.1"/>
      <rect x="806.2" y="163.3" width="18" height="199.7"/>
      <!-- 2010 -->
      <rect x="835.6" y="163.3" width="18" height="259.5"/>
      <rect x="865" y="163.3" width="18" height="279.1"/>
      <rect x="894.4" y="163.3" width="18" height="228.7"/>
      <rect x="923.8" y="163.3" width="18" height="176.4"/>
      <rect x="953.2" y="163.3" width="18" height="154"/>
      <rect x="982.6" y="163.3" width="18" height="252.9"/>
      <rect x="1012" y="163.3" width="18" height="266"/>
      <rect x="1041.4" y="163.3" width="18" height="262.3"/>
      <rect x="1070.8" y="163.3" width="18" height="226.8"/>
      <rect x="1100.2" y="163.3" width="18" height="194.1"/>
      <rect x="1129.6" y="163.3" width="18" height="182.9"/>
    </g>

    <path d="M110 70V490H1170" fill="none" stroke="#495057" stroke-width="2"/>
    <path d="M110 163.3H1170" fill="none" stroke="#30383d" stroke-width="2.5"/>
    <text x="483" y="476" font-size="22" font-weight="600" fill="#30383d">Jan 2009: reports begin</text>
    <text x="38" y="280" transform="rotate(-90 38 280)" text-anchor="middle" font-size="22">Effect on electricity use (%)</text>
    <g font-size="20" fill="#495057" text-anchor="end">
      <text x="96" y="77">1</text>
      <text x="96" y="170.3">0</text>
      <text x="96" y="263.7">−1</text>
      <text x="96" y="357">−2</text>
      <text x="96" y="450.3">−3</text>
    </g>
    <g font-size="20" fill="#495057" text-anchor="middle">
      <text x="139" y="522">1</text><text x="197.8" y="522">3</text><text x="256.6" y="522">5</text><text x="315.4" y="522">7</text><text x="374.2" y="522">9</text><text x="433" y="522">11</text>
      <text x="491.8" y="522">1</text><text x="550.6" y="522">3</text><text x="609.4" y="522">5</text><text x="668.2" y="522">7</text><text x="727" y="522">9</text><text x="785.8" y="522">11</text>
      <text x="844.6" y="522">1</text><text x="903.4" y="522">3</text><text x="962.2" y="522">5</text><text x="1021" y="522">7</text><text x="1079.8" y="522">9</text><text x="1138.6" y="522">11</text>
    </g>
    <g font-size="26" font-weight="700" text-anchor="middle">
      <text x="301" y="563">2008</text>
      <text x="654" y="563">2009</text>
      <text x="992" y="563">2010</text>
    </g>
  </g>
</svg>
