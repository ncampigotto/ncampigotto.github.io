<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 606" role="img" aria-labelledby="title desc">
  <title id="title">Donations by treatment</title>
  <desc id="desc">Donation rates for No ask, Facebook, Peer, Peer plus Visibility, and Simple ask. Reference lines mark the No ask and Simple ask rates. Sample sizes and p values are shown below.</desc>
  <!-- Redrawn from Goette and Tripodi (2024), Figure 2. Positions of dots and confidence intervals are traced from the original PNG. -->
  <style>
    text { font-family: "Times New Roman", Times, serif; fill: #000; }
    .axis { stroke: #111; stroke-width: 1.8; }
    .tick { stroke: #111; stroke-width: 1.7; }
    .tick-label { font-size: 27px; }
    .group { font-family: Roboto, Arial, sans-serif; font-size: 29px; font-weight: bold; fill: currentColor; }
    .reference-label { fill: currentColor; }
    .detail, .pvalue { font-size: 21px; }
    .effect { font-size: 25px; }
    .noask { color: #7A7800; }
    .facebook { color: #383B57; }
    .peer { color: #1B998B; }
    .peervis { color: #BD0F5D; }
    .simpleask { color: #FF7E47; }
    .interval { stroke: currentColor; stroke-width: 2.7; fill: none; }
    .dot { fill: currentColor; }
    .estimate { cursor: default; }
    .hover-target { fill: transparent; pointer-events: all; }
  </style>

  <rect width="1200" height="606" fill="#fff"/>

  <!-- The original plot's horizontal reference levels. -->
  <path d="M 98,158 H 1199" fill="none" stroke="#7A7800" stroke-width="1.8" stroke-dasharray="13 5 2 5"/>
  <path d="M 98,86 H 1199" fill="none" stroke="#FF7E47" stroke-width="1.8" stroke-dasharray="13 5 2 5"/>
  <text class="reference-label noask" x="107" y="152" font-size="26">No ask</text>
  <text class="reference-label simpleask" x="102" y="80" font-size="26">Simple ask</text>

  <!-- Axes and y-axis ticks, measured as a share of donors. -->
  <path class="axis" d="M 95,5 V 450 H 1199" fill="none"/>
  <path class="tick" d="M 83,430 H 95 M 83,299 H 95 M 83,168 H 95 M 83,37 H 95"/>
  <text class="tick-label" x="68" y="430" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 68 430)">0</text>
  <text class="tick-label" x="68" y="299" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 68 299)">0.05</text>
  <text class="tick-label" x="68" y="168" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 68 168)">0.10</text>
  <text class="tick-label" x="68" y="37" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 68 37)">0.15</text>
  <text x="29" y="225" font-size="29" text-anchor="middle" transform="rotate(-90 29 225)">Donated in the study period</text>

  <!-- Capped 95% confidence intervals and treatment means. Each point has a mouse-hover explanation. -->
  <g class="estimate noask">
    <title>No ask: the share who donated after receiving no request.</title>
    <path class="interval" d="M 221,134 V 182 M 212,134 H 230 M 212,182 H 230"/>
    <circle class="dot" cx="221" cy="158" r="8"/>
    <circle class="hover-target" cx="221" cy="158" r="17"/>
  </g>
  <g class="estimate facebook">
    <title>Facebook: the share who donated when Facebook recognition was offered. The +10.6% label is the increase relative to No ask.</title>
    <path class="interval" d="M 435,104 V 155 M 426,104 H 444 M 426,155 H 444"/>
    <circle class="dot" cx="435" cy="130" r="8"/>
    <text class="effect" x="445" y="146">+10.6%</text>
    <circle class="hover-target" cx="435" cy="130" r="17"/>
  </g>
  <g class="estimate peer">
    <title>Peer: the share who donated after learning how often peers had donated. The +20.2% label is the increase relative to No ask.</title>
    <path class="interval" d="M 647,85 V 123 M 638,85 H 656 M 638,123 H 656"/>
    <circle class="dot" cx="647" cy="103" r="8"/>
    <text class="effect" x="657" y="121">+20.2%</text>
    <circle class="hover-target" cx="647" cy="103" r="17"/>
  </g>
  <g class="estimate peervis">
    <title>Peer + Visibility: the share who donated after learning about peers' past donations and being told that future donors would be named. The +23.7% label is the increase relative to No ask.</title>
    <path class="interval" d="M 860,75 V 113 M 851,75 H 869 M 851,113 H 869"/>
    <circle class="dot" cx="860" cy="94" r="8"/>
    <text class="effect" x="870" y="112">+23.7%</text>
    <circle class="hover-target" cx="860" cy="94" r="17"/>
  </g>
  <g class="estimate simpleask">
    <title>Simple ask: the share who donated after a simple request without social recognition. The +26.6% label is the increase relative to No ask.</title>
    <path class="interval" d="M 1073,58 V 113 M 1064,58 H 1082 M 1064,113 H 1082"/>
    <circle class="dot" cx="1073" cy="86" r="8"/>
    <text class="effect" x="1084" y="104">+26.6%</text>
    <circle class="hover-target" cx="1073" cy="86" r="17"/>
  </g>

  <!-- Treatment names and the statistics printed beneath the original plot. -->
  <path class="tick" d="M 221,450 V 462 M 435,450 V 462 M 647,450 V 462 M 860,450 V 462 M 1073,450 V 462"/>
  <g text-anchor="middle" transform="translate(0 2)">
    <text class="group noask" x="221" y="490">No ask</text>
    <text class="group facebook" x="435" y="490">Facebook</text>
    <text class="group peer" x="647" y="490">Peer</text>
    <text class="group peervis" x="860" y="490">Peer + Visibility</text>
    <text class="group simpleask" x="1073" y="490">Simple ask</text>
    <text class="detail" x="221" y="525">Obs. = 4,436</text>
    <text class="detail" x="435" y="525">Obs. = 4,220</text>
    <text class="detail" x="647" y="525">Obs. = 8,456</text>
    <text class="detail" x="860" y="525">Obs. = 8,450</text>
    <text class="detail" x="1073" y="525">Obs. = 4,197</text>
    <text class="pvalue" x="435" y="553"><tspan font-style="italic">p</tspan><tspan font-size="15" baseline-shift="sub">No ask</tspan><tspan baseline-shift="baseline"> = 0.072</tspan></text>
    <text class="pvalue" x="647" y="553"><tspan font-style="italic">p</tspan><tspan font-size="15" baseline-shift="sub">No ask</tspan><tspan baseline-shift="baseline"> = 0.000</tspan></text>
    <text class="pvalue" x="860" y="553"><tspan font-style="italic">p</tspan><tspan font-size="15" baseline-shift="sub">No ask</tspan><tspan baseline-shift="baseline"> = 0.000</tspan></text>
    <text class="pvalue" x="1073" y="553"><tspan font-style="italic">p</tspan><tspan font-size="15" baseline-shift="sub">No ask</tspan><tspan baseline-shift="baseline"> = 0.000</tspan></text>
    <text class="pvalue" x="221" y="553"><tspan font-style="italic">p</tspan><tspan font-size="15" baseline-shift="sub">Simple ask</tspan><tspan baseline-shift="baseline"> = 0.000</tspan></text>
    <text class="pvalue" x="435" y="586"><tspan font-style="italic">p</tspan><tspan font-size="15" baseline-shift="sub">Simple ask</tspan><tspan baseline-shift="baseline"> = 0.019</tspan></text>
    <text class="pvalue" x="647" y="586"><tspan font-style="italic">p</tspan><tspan font-size="15" baseline-shift="sub">Simple ask</tspan><tspan baseline-shift="baseline"> = 0.274</tspan></text>
    <text class="pvalue" x="860" y="586"><tspan font-style="italic">p</tspan><tspan font-size="15" baseline-shift="sub">Simple ask</tspan><tspan baseline-shift="baseline"> = 0.806</tspan></text>
  </g>
</svg>
