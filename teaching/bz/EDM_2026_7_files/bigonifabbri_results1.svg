<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 595" width="1200" height="595" role="img" aria-labelledby="chart-title chart-description" style="cursor: default">
  <title id="chart-title">Inequality index by condition and village group</title>
  <desc id="chart-description">Two panels compare Control and Treated villages under Merit and Luck. Bars and standard errors are traced from the original figure by Fabbri and Bigoni; Merit means are also reported in the paper.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #131516; }
      .grid { stroke: #d8dde0; stroke-width: 1.5; }
      .axis { stroke: #222; stroke-width: 1.5; }
      .tick { font-size: 21px; text-anchor: end; }
      .axis-title { font-size: 21px; text-anchor: middle; }
      .panel-title { font-size: 31px; font-weight: 700; text-anchor: middle; }
      .category { font-size: 22px; font-weight: 700; text-anchor: middle; }
      .control-label { fill: #131516; }
      .treated-label { fill: #C90000; }
      .merit-title { fill: #009907; }
      .luck-title { fill: #003698; }
      .control-bar { fill: #bfbfbf; stroke: #999; stroke-width: 1.2; }
      .treated-bar { fill: #D95F5F; stroke: #B92D2D; stroke-width: 1.2; }
      .interval { stroke: #999; stroke-width: 1.8; fill: none; }
      .treated-bar + .interval { stroke: #B92D2D; }
      .data-bar { cursor: default; }
      .data-bar rect { transition: fill 150ms ease, stroke 150ms ease, stroke-width 150ms ease; }
      .data-bar .interval { transition: stroke 150ms ease, stroke-width 150ms ease; }
      .data-bar:hover .control-bar, .data-bar:focus .control-bar { fill: #8F8F8F; stroke: #4A4A4A; stroke-width: 2; }
      .data-bar:hover .treated-bar, .data-bar:focus .treated-bar { fill: #C90000; stroke: #8F0000; stroke-width: 2; }
      .data-bar:hover .interval, .data-bar:focus .interval { stroke: #263238; stroke-width: 2.7; }
      .data-bar:hover .treated-bar + .interval, .data-bar:focus .treated-bar + .interval { stroke: #8F0000; }
    </style>
    <g id="panel-axes">
      <line class="grid" x1="0" y1="84" x2="484" y2="84" />
      <line class="grid" x1="0" y1="141" x2="484" y2="141" />
      <line class="grid" x1="0" y1="198" x2="484" y2="198" />
      <line class="grid" x1="0" y1="256" x2="484" y2="256" />
      <line class="grid" x1="0" y1="313" x2="484" y2="313" />
      <line class="grid" x1="0" y1="370" x2="484" y2="370" />
      <line class="grid" x1="0" y1="427" x2="484" y2="427" />
      <line class="grid" x1="0" y1="484" x2="484" y2="484" />
      <path class="axis" d="M0 72 V541 H484" fill="none" />
      <path class="axis" d="M-7 84 H0 M-7 141 H0 M-7 198 H0 M-7 256 H0 M-7 313 H0 M-7 370 H0 M-7 427 H0 M-7 484 H0 M-7 541 H0 M110 541 V549 M350 541 V549" fill="none" />
      <text class="tick" x="-13" y="91">.4</text>
      <text class="tick" x="-13" y="148">.35</text>
      <text class="tick" x="-13" y="205">.3</text>
      <text class="tick" x="-13" y="263">.25</text>
      <text class="tick" x="-13" y="320">.2</text>
      <text class="tick" x="-13" y="377">.15</text>
      <text class="tick" x="-13" y="434">.1</text>
      <text class="tick" x="-13" y="491">.05</text>
      <text class="tick" x="-13" y="548">0</text>
      <text class="axis-title" transform="translate(-58 315) rotate(-90)">Inequality index</text>
    </g>
  </defs>

  <rect width="1200" height="595" fill="#fff" />

  <g transform="translate(78 0)">
    <use href="#panel-axes" />
    <text class="panel-title merit-title" x="229" y="52">Merit</text>
    <g class="data-bar" tabindex="0">
      <title>Merit, control villages: the average inequality index is about 0.37. The Treatment and Control results do not differ significantly.</title>
      <rect class="control-bar" x="38" y="126" width="145" height="415" />
      <path class="interval" d="M110 103 V149 M104 103 H116 M104 149 H116" />
    </g>
    <g class="data-bar" tabindex="0">
      <title>Merit, treated villages: the average inequality index is about 0.36. The Treatment and Control results do not differ significantly.</title>
      <rect class="treated-bar" x="278" y="131" width="145" height="410" />
      <path class="interval" d="M350 108 V153 M344 108 H356 M344 153 H356" />
    </g>
    <text class="category control-label" x="110" y="573">Control</text>
    <text class="category treated-label" x="350" y="573">Treated</text>
  </g>

  <g transform="translate(706 0)">
    <use href="#panel-axes" />
    <text class="panel-title luck-title" x="242" y="52">Luck</text>
    <g class="data-bar" tabindex="0">
      <title>Luck, control villages: the average inequality index is about 0.14. The Treatment and Control results differ significantly.</title>
      <rect class="control-bar" x="38" y="387" width="143" height="154" />
      <path class="interval" d="M110 361 V411 M104 361 H116 M104 411 H116" />
    </g>
    <g class="data-bar" tabindex="0">
      <title>Luck, treated villages: the average inequality index is about 0.19. The Treatment and Control results differ significantly.</title>
      <rect class="treated-bar" x="278" y="325" width="144" height="216" />
      <path class="interval" d="M350 295 V356 M344 295 H356 M344 356 H356" />
    </g>
    <text class="category control-label" x="110" y="573">Control</text>
    <text class="category treated-label" x="350" y="573">Treated</text>
  </g>
</svg>
